[workspace]
members = ["cargo:codex-rs"]

# Config for 'dist' (cargo-dist v0.32)
[dist]
# CI 运行时使用的 dist 版本（Cargo SemVer）
cargo-dist-version = "0.32.0"
# CI 后端
ci = "github"
# 每个应用的安装器：shell(mac/linux) + powershell(windows)
installers = ["shell", "powershell"]
# 目标平台（见 gienx/packaging/DESIGN.md §4）
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# 安装器放置二进制的路径
install-path = "CARGO_HOME"
# 发版托管在 GitHub Releases
hosting = "github"
# 不安装自更新器
install-updater = false
